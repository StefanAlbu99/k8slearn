name: 'Opentofu with OIDC'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'IAC/DEV/**'    # Only trigger if files in DEV change
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}

jobs:
  opentofu-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repo # pulls the repo code
        uses: actions/checkout@v4

      - name: Set up OpenTofu # installs OpenTofu CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: 1.6.0  # matches Tofu 1.10.6

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: false  # optional, no PowerShell session needed

      - name: Initialize OpenTofu
        run: tofu init -backend-config=backend.dev.tfvars

      - name: Plan OpenTofu
        run: tofu plan
