# certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls-secret
spec:
  secretName: argocd-tls-secret
  privateKey:
    rotationPolicy: Always
  commonName: argocd.stefan-albu.com
  dnsNames:
    - argocd.stefan-albu.com
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer